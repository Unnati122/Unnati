<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Control - UNNATI (OIL)</title>
  
  <!-- UX4G Design System CSS -->
  <link rel="stylesheet" href="https://cdn.ux4g.gov.in/UX4G@3.0.18/index.css">
  
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Core Design overrides -->
  <link rel="stylesheet" href="app.css?v=5">
  
  <style>
    /* Remove card container and make it blend directly into main workspace */
    .main-workspace {
      padding: 20px 12px !important;
      background: #FFFFFF !important;
      overflow: hidden !important;
    }
    .main-workspace .card {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      margin: 0 !important;
      border-radius: 0 !important;
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }
    .main-workspace .table-responsive {
      border: none !important;
    }
    
    /* Hide scrollbars completely on table and workspace containers */
    .table-responsive::-webkit-scrollbar, 
    .main-workspace::-webkit-scrollbar,
    .card-body::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none !important;
    }
    .table-responsive, 
    .main-workspace,
    .card-body,
    body {
      -ms-overflow-style: none !important;  /* IE and Edge */
      scrollbar-width: none !important;  /* Firefox */
    }
    
    /* Strict WBS Column Centering and Formatting */
    #scheduleTable {
      table-layout: fixed !important;
    }
    #scheduleTable th, #scheduleTable td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* Remove browser default blue focus ring / dotted border */
    *:focus, *:active, a:focus, button:focus, input:focus, select:focus, textarea:focus {
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <!-- Shared components injected by components.js -->
  <div class="app-layout" id="app-layout">

    <!-- Main Workspace -->
    <main class="main-workspace" style="display: flex; flex-direction: column;">
      
      <!-- Hidden elements to satisfy DOM references in app.js dashboard loader -->
      <div style="display: none;">
        <span id="totalTasksCount">0</span>
        <span id="overallProgress">0%</span>
        <span id="pendingReviewsCount">0</span>
        <span id="avgConfidence">0%</span>
      </div>

      <!-- Main Baseline Table (Rendered directly in main-workspace with floating card styles) -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center" style="border-bottom: 1px solid #F1F5F9 !important; flex-shrink: 0;">
          <div>
            <h5 class="mb-0 text-dark font-weight-bold" style="font-family: 'Outfit', sans-serif; font-size: 15.5px; color: #1E293B !important;">Schedule Control</h5>
            <p class="text-muted mb-0" style="font-size: 11.5px;">Work Breakdown Structure &amp; Activity Variance Tracking</p>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #475569; background: #FFFFFF; border: 1px solid #E2E8F0; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">
              <i class="fa-solid fa-sliders" style="font-size: 10px;"></i> Filter
            </button>
            <button style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #475569; background: #FFFFFF; border: 1px solid #E2E8F0; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">
              <i class="fa-solid fa-download" style="font-size: 10px;"></i> Export
            </button>
          </div>
        </div>
        <div class="card-body p-0" style="flex: 1; overflow-y: auto;">
          <div class="table-responsive" style="height: 100%;">
            <table class="table table-hover align-middle mb-0" id="scheduleTable" style="font-size: 12.0px; width: 100%;">
              <thead class="table-light" style="position: sticky; top: 0; z-index: 10;">
                <tr style="background: #F8FAFC; border-bottom: 1px solid #E2E8F0;">
                  <th style="padding: 12px 16px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 21%;">WBS / Activity Name</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 11.5%;">Activity ID</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 9%;">Plan Start</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 9%;">Plan Finish</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 9%; text-align: center;">Actual Start</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 9%; text-align: center;">Actual Finish</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 7%; text-align: right;">Prog %</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 7%; text-align: right;">Variance</th>
                  <th style="padding: 12px 8px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 6.5%; text-align: right;">AI Conf.</th>
                  <th style="padding: 12px 16px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; width: 11%; text-align: right;">Status</th>
                </tr>
              </thead>
              <tbody>
                <!-- Dynamic WBS rendering -->
                <tr class="skeleton-table-row">
                  <td style="padding: 12px 16px;"><span class="skeleton-box" style="width: 150px; height: 16px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 70px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 35px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 16px; text-align: right;"><span class="skeleton-box" style="width: 75px; height: 18px; border-radius: 20px;"></span></td>
                </tr>
                <tr class="skeleton-table-row">
                  <td style="padding: 12px 16px;"><span class="skeleton-box" style="width: 220px; height: 16px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 70px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 35px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 16px; text-align: right;"><span class="skeleton-box" style="width: 80px; height: 18px; border-radius: 20px;"></span></td>
                </tr>
                <tr class="skeleton-table-row">
                  <td style="padding: 12px 16px;"><span class="skeleton-box" style="width: 180px; height: 16px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 70px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 35px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 16px; text-align: right;"><span class="skeleton-box" style="width: 70px; height: 18px; border-radius: 20px;"></span></td>
                </tr>
                <tr class="skeleton-table-row">
                  <td style="padding: 12px 16px;"><span class="skeleton-box" style="width: 250px; height: 16px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 70px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px;"><span class="skeleton-box" style="width: 65px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: center;"><span class="skeleton-box" style="width: 60px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 35px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 8px; text-align: right;"><span class="skeleton-box" style="width: 30px; height: 14px;"></span></td>
                  <td style="padding: 12px 16px; text-align: right;"><span class="skeleton-box" style="width: 75px; height: 18px; border-radius: 20px;"></span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- Scripts -->
  <script src="https://cdn.ux4g.gov.in/UX4G@3.0.18/ux4g.js"></script>
  <script src="components.js"></script>
  <script src="app.js?v=5"></script>
  <script>
    // Initialize Dashboard data (loads metrics + scheduleTable automatically)
    document.addEventListener("DOMContentLoaded", () => {
      renderSharedComponents('schedule');
      loadDashboard();
    });
  </script>
  </div>
</body>
</html>
